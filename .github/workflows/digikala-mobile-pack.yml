name: Digikala Mobile Data Pack

on:
  push:
    branches:
      - digikala-mobile-pack-20260920
    paths:
      - ".github/workflows/digikala-mobile-pack.yml"
      - "tools/digikala_mobile_pack.py"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Collect current Digikala mobile data
        run: python tools/digikala_mobile_pack.py
      - name: Upload data pack
        uses: actions/upload-artifact@v4
        with:
          name: digikala-mobile-pack
          path: digikala_mobile_pack/
          retention-days: 7
